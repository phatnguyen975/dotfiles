# ==========================================
# TERMINAL COLORS & SETTINGS
# ==========================================

# TrueColor support
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Allow passthrough of escape sequences to the terminal
set -g allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

# Update environment variables when attaching to a session
set -ga update-environment "TERM"

# Enable mouse support (scrolling, resizing, selecting)
set -g mouse on

# Start window and pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# KEY BINDINGS
# ==========================================

# Change Prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Reload config file quickly
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded!"

# Split panes using '\' and '-' with the current path
unbind %
bind '\' split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# New window with the current path
bind c new-window -c '#{pane_current_path}'

# Resize panes using Vim keys (h, j, k, l)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z # Toggle pane zoom

# Vim-style copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane # Not exit copy mode on mouse release

# vim-tmux-navigator plugin keybindings
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ==========================================
# PLUGINS
# ==========================================

# Set plugin folder to ~/.config/tmux/plugins/
set -g @plugin 'tmux-plugins/tpm' # Tmux Plugin Manager
set -g @plugin 'christoomey/vim-tmux-navigator' # Move between nvim and tmux panes
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save sessions even after reboot

# ==========================================
# THEME & STATUS BAR
# ==========================================

# Configure the catppuccin plugin
set -g @catppuccin_flavor "frappe"
set -g @catppuccin_window_status_style "basic"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Window appearance
set -g window-status-separator "" 
set -g @catppuccin_window_current_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text "#[bg=#{@thm_mantle}] #{b:pane_current_path}"

set -g @catppuccin_window_text "#[bg=#{@thm_mantle}] #W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_number_color "#{@thm_sky}"

# Status Left: Session Name
set -g status-left ""
set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S#[reverse]█"

# Status Right: RAM and Clock
set -g status-interval 20
set -g status-right-length 150
set -g status-right ""
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰍛 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(free | grep Mem | awk '{print int($3/$2 * 100)}')%% "
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰢗 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %d/%m/%Y %H:%M "

# Make status bar background transparent
set -g status-bg default
set -g status-style bg=default

run '~/.config/tmux/plugins/tpm/tpm'
