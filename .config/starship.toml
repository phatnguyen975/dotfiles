"$schema" = "https://starship.rs/config-schema.json"

format = """
$os\
$username\
$directory\
$git_branch\
$git_metrics\
$git_status\
$c\
$cpp\
$java\
$python\
$lua\
$nodejs\
$golang\
$rust\
$zig\
$kotlin\
$docker_context\
$memory_usage\
$time\
$line_break\
$character"""

palette = "catppuccin_frappe"

[palettes.catppuccin_frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"

[os]
disabled = false
style = "sapphire"
format = '[$symbol]($style)'

[os.symbols]
Windows = "󰍲 "
Macos = " "
Linux = " "
Ubuntu = " "
Arch = " "
CentOS = " "
Debian = " "
Fedora = " "
Kali = " "
NixOS = " "

[username]
disabled = false
show_always = true
style_user = "sapphire"
style_root = "sapphire"
format = '[$user]($style) '

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "peach"
format = '[$path]($style) '

[git_branch]
disabled = false
symbol = " "
style = "mauve"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

[git_status]
disabled = false
staged = "+${count}"
modified = "!${count}"
untracked = "?${count}"
renamed = "»${count}"
deleted = "✘${count}"
conflicted = "=${count}"
stashed = "$${count}"
up_to_date = ""
ahead = "󰶼${count}"
behind = "󰶹${count}"
diverged = "󰶼${ahead_count}󰶹${behind_count}"
style = "yellow"
format = '([\[$staged$modified$untracked$renamed$deleted$conflicted$stashed$ahead_behind\]]($style) )'

[c]
symbol = " "
style = "blue"
format = '[$symbol($version(-$name) )]($style)'

[cpp]
symbol = " "
style = "blue"
format = '[$symbol($version(-$name) )]($style)'

[java]
symbol = " "
style = "blue"
format = '[${symbol}(${version} )]($style)'

[python]
symbol = " "
style = "blue"
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[lua]
symbol = " "
style = "blue"
format = '[$symbol($version )]($style)'

[nodejs]
symbol = "󰎙 "
style = "blue"
format = '[$symbol($version )]($style)'

[golang]
symbol = " "
style = "blue"
format = '[$symbol($version )]($style)'

[rust]
symbol = "󱘗 "
style = "blue"
format = '[$symbol($version )]($style)'

[zig]
symbol = " "
style = "blue"
format = '[$symbol($version )]($style)'

[kotlin]
symbol = " "
style = "blue"
format = '[$symbol($version )]($style)'

[docker_context]
symbol = " "
style = "sapphire"
format = '[$symbol$context]($style) '

[memory_usage]
disabled = false
threshold = -1
symbol = "󰍛 "
style = "overlay2"
format = '[$symbol]($style)[$ram]($style) '

[time]
disabled = false
time_format = "%R"
style = "flamingo"
format = "[󰅐 ]($style)[$time]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[](green)"
error_symbol = "[](red)"
vimcmd_symbol = "[](green)"
vimcmd_replace_one_symbol = "[](lavender)"
vimcmd_replace_symbol = "[](lavender)"
vimcmd_visual_symbol = "[](yellow)"
